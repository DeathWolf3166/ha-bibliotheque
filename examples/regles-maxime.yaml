  - {id: reveils, title: "Réveils", contexts: [particulier, hotel], match: "reveil|nouvelle_automatisation"}
  - {id: electromenager-fin-cycle, title: "Électroménager : fin de cycle", contexts: [particulier, hotel], match: machine_a_laver}
  - {id: assistant-telephone, title: "Assistant téléphonique IA (Camille)", contexts: [particulier, hotel, logistique, bureau], match: assistant_telephone}
